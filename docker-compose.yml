services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["rag-data:/data"]

  # Optional: a pgvector database for experimenting with a Postgres-backed store (not wired in yet).
  pgvector:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]

volumes:
  rag-data:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "RAG over PDF/text/scanned documents: hybrid retrieval, cited answers, refusal, evaluation harness, FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-chroma>=0.2",
  "chromadb>=0.5",
  "rank-bm25>=0.2.2",
  "pypdf>=4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
minilm = ["langchain-huggingface>=0.1", "sentence-transformers>=3"]
ocr = ["pytesseract>=0.3.10", "pillow>=10"]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "reportlab>=4", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI File(...) defaults

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ocr]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python -m rag_assistant.eval --embeddings hashing --llm fake
